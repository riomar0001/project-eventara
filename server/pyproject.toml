[project]
name = "eventara"
version = "0.1.0"
description = "Eventara event management platform API (FastAPI)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.16.1",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "boto3>=1.35.0",
    "fastapi==0.135.2",
    "nh3>=0.3.4",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    "pyjwt==2.10.1",
    "redis>=5.0",
    "sqlalchemy[asyncio]==2.0.48",
    "uvicorn==0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 150
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"seeds/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]