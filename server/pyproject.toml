[project]
name = "eventara"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.16.1",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "arq>=0.26",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "click==8.3.1",
    "colorama==0.4.6",
    "fastapi==0.135.2",
    "greenlet==3.3.2",
    "h11==0.16.0",
    "idna==3.11",
    "mako==1.3.10",
    "mangum==0.21.0",
    "markupsafe==3.0.3",
    "passlib==1.7.4",
    "pip==25.2",
    "psycopg2-binary==2.9.10",
    "pydantic[email]==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.13.1",
    "pyjwt==2.10.1",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.48",
    "starlette==1.0.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "uvicorn==0.42.0",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "scalar-fastapi==1.8.1",
    "cryptography>=46.0.6",
    "podman-compose>=1.5.0",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"seeds/*" = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
