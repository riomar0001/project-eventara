<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Eventara — Davao DeFi Community</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <style>
      :root {
        --bg: oklch(0.17 0.008 150);
        --bg-2: oklch(0.21 0.01 150);
        --surface: oklch(0.23 0.012 150);
        --surface-2: oklch(0.27 0.014 150);
        --line: oklch(0.32 0.015 150);
        --line-soft: oklch(0.28 0.012 150 / 0.6);
        --text: oklch(0.98 0.005 150);
        --text-dim: oklch(0.78 0.01 150);
        --text-mute: oklch(0.58 0.012 150);
        --lime: oklch(0.9 0.22 128);
        --lime-dim: oklch(0.78 0.19 128);
        --lime-glow: oklch(0.9 0.22 128 / 0.35);
        --amber: oklch(0.82 0.17 75);
        --amber-dim: oklch(0.72 0.16 75);
        --amber-glow: oklch(0.82 0.17 75 / 0.4);
        --red: oklch(0.7 0.2 25);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'ss01', 'cv11';
        overflow-x: hidden;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input,
      textarea {
        font-family: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }

      /* --- glow/mesh background ------------------------------------------ */
      .mesh {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      .mesh::before,
      .mesh::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.55;
      }
      .mesh::before {
        width: 720px;
        height: 720px;
        left: -140px;
        top: -180px;
        background: radial-gradient(circle, oklch(0.9 0.22 128 / 0.55), transparent 65%);
      }
      .mesh::after {
        width: 620px;
        height: 620px;
        right: -160px;
        top: 40px;
        background: radial-gradient(circle, oklch(0.82 0.17 75 / 0.4), transparent 65%);
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 30%, transparent 75%);
        opacity: 0.35;
        pointer-events: none;
      }

      /* --- reusable --------------------------------------------------- */
      .container {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 32px;
      }
      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-mute);
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .eyebrow .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 12px var(--lime-glow);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 22px;
        border-radius: 999px;
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition: all 180ms ease;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--lime);
        color: #0a1005;
        box-shadow:
          0 8px 28px -10px var(--lime-glow),
          inset 0 -1px 0 oklch(0.7 0.2 128);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 40px -10px var(--lime-glow);
      }
      .btn-amber-outline {
        border: 1px solid var(--amber);
        color: var(--amber);
        background: oklch(0.82 0.17 75 / 0.05);
      }
      .btn-amber-outline:hover {
        background: oklch(0.82 0.17 75 / 0.12);
        box-shadow: 0 0 24px -6px var(--amber-glow);
      }
      .btn-ghost {
        color: var(--text-dim);
        border: 1px solid var(--line);
        background: oklch(1 0 0 / 0.02);
      }
      .btn-ghost:hover {
        color: var(--text);
        border-color: oklch(1 0 0 / 0.2);
      }
      .btn-white-outline {
        border: 1px solid oklch(1 0 0 / 0.25);
        color: var(--text);
        background: transparent;
      }
      .btn-white-outline:hover {
        border-color: var(--text);
        background: oklch(1 0 0 / 0.04);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 18px;
        position: relative;
        transition:
          transform 260ms ease,
          border-color 260ms ease,
          box-shadow 260ms ease;
      }

      /* --- hero ------------------------------------------------------- */
      .hero {
        position: relative;
        padding: 96px 0 120px;
        text-align: center;
      }
      .hero h1 {
        font-size: clamp(44px, 6.4vw, 88px);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 0.98;
        margin: 22px auto 24px;
        max-width: 14ch;
        text-wrap: balance;
      }
      .hero .hl {
        background: linear-gradient(100deg, var(--lime) 20%, oklch(0.95 0.2 140) 70%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-style: italic;
        font-weight: 500;
        font-family: 'Plus Jakarta Sans', serif;
      }
      .hero p.sub {
        font-size: clamp(16px, 1.35vw, 19px);
        line-height: 1.55;
        color: var(--text-dim);
        max-width: 58ch;
        margin: 0 auto 40px;
        text-wrap: pretty;
      }
      .hero-actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .hero-stats {
        margin-top: 72px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--line-soft);
        border-bottom: 1px solid var(--line-soft);
      }
      .hero-stats > div {
        padding: 22px 18px;
        border-right: 1px solid var(--line-soft);
        text-align: left;
      }
      .hero-stats > div:last-child {
        border-right: none;
      }
      .hero-stats .num {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .hero-stats .lbl {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-mute);
        font-family: 'JetBrains Mono', monospace;
        margin-top: 4px;
      }
      .hero-stats .num.lime {
        color: var(--lime);
      }
      .hero-stats .num.amber {
        color: var(--amber);
      }

      /* --- nav -------------------------------------------------------- */
      .nav {
        position: sticky;
        top: 0;
        z-index: 40;
        backdrop-filter: blur(18px) saturate(140%);
        background: oklch(0.17 0.008 150 / 0.75);
        border-bottom: 1px solid var(--line-soft);
      }
      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-size: 18px;
      }
      .logo-mark {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: linear-gradient(145deg, var(--lime), var(--lime-dim));
        color: #0a1005;
        box-shadow: 0 0 18px -4px var(--lime-glow);
      }
      .nav-links {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .nav-links a.link {
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 14.5px;
        color: var(--text-dim);
        transition: color 150ms;
      }
      .nav-links a.link:hover {
        color: var(--text);
      }
      .nav-links a.link.active {
        color: var(--text);
      }

      /* --- section heading ------------------------------------------- */
      .section {
        position: relative;
        padding: 96px 0;
      }
      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 40px;
        flex-wrap: wrap;
      }
      .section-head h2 {
        font-size: clamp(30px, 3.4vw, 44px);
        letter-spacing: -0.03em;
        font-weight: 600;
        margin: 10px 0 0;
        text-wrap: balance;
      }
      .section-head .lead {
        color: var(--text-dim);
        max-width: 46ch;
        font-size: 15px;
        margin: 10px 0 0;
      }

      /* --- live card ------------------------------------------------- */
      .live-card {
        position: relative;
        background: linear-gradient(180deg, oklch(0.23 0.012 150) 0%, oklch(0.2 0.01 150) 100%);
        border: 1px solid var(--line);
        border-radius: 24px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        min-height: 420px;
      }
      .live-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 90% 10%, oklch(0.82 0.17 75 / 0.18), transparent 40%);
        pointer-events: none;
      }
      .live-visual {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 30% 70%, oklch(0.9 0.22 128 / 0.25), transparent 55%),
          radial-gradient(circle at 75% 25%, oklch(0.82 0.17 75 / 0.3), transparent 55%), linear-gradient(135deg, oklch(0.2 0.01 150), oklch(0.15 0.008 150));
        border-left: 1px solid var(--line-soft);
      }
      .live-visual .stripe-art {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(110deg, transparent 0 22px, oklch(1 0 0 / 0.025) 22px 24px);
      }
      .live-visual .label-art {
        position: absolute;
        bottom: 16px;
        left: 16px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: oklch(1 0 0 / 0.35);
      }
      .live-visual .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(26px);
      }
      .live-visual .orb-a {
        width: 220px;
        height: 220px;
        left: 18%;
        top: 22%;
        background: var(--lime);
        opacity: 0.3;
      }
      .live-visual .orb-b {
        width: 180px;
        height: 180px;
        right: 14%;
        bottom: 18%;
        background: var(--amber);
        opacity: 0.4;
      }

      .live-body {
        padding: 36px 40px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        position: relative;
      }
      .live-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 6px 10px;
        background: oklch(0.82 0.17 75 / 0.12);
        border: 1px solid oklch(0.82 0.17 75 / 0.35);
        border-radius: 999px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--amber);
        width: fit-content;
      }
      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--amber);
        position: relative;
      }
      .pulse::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: var(--amber);
        opacity: 0.5;
        animation: ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes ping {
        0% {
          transform: scale(0.6);
          opacity: 0.6;
        }
        80%,
        100% {
          transform: scale(1.8);
          opacity: 0;
        }
      }
      .live-body h3 {
        font-size: clamp(26px, 2.6vw, 34px);
        letter-spacing: -0.025em;
        font-weight: 600;
        margin: 0;
        line-height: 1.1;
      }
      .live-meta {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px 28px;
        margin-top: 6px;
      }
      .live-meta .k {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-mute);
      }
      .live-meta .v {
        font-size: 14.5px;
        color: var(--text);
        margin-top: 4px;
        font-weight: 500;
      }
      .now-playing {
        background: oklch(1 0 0 / 0.03);
        border: 1px solid var(--line-soft);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: auto;
      }
      .speaker-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--amber), oklch(0.72 0.16 75));
        display: grid;
        place-items: center;
        color: #1a1005;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
      }
      .now-playing .sp-name {
        font-size: 14.5px;
        font-weight: 600;
      }
      .now-playing .sp-topic {
        font-size: 12.5px;
        color: var(--text-dim);
        margin-top: 2px;
      }
      .now-playing .wave {
        display: flex;
        align-items: end;
        gap: 3px;
        margin-left: auto;
      }
      .wave span {
        display: block;
        width: 3px;
        background: var(--lime);
        border-radius: 2px;
        animation: wave 1.1s ease-in-out infinite;
      }
      .wave span:nth-child(1) {
        height: 10px;
        animation-delay: 0s;
      }
      .wave span:nth-child(2) {
        height: 16px;
        animation-delay: 0.15s;
      }
      .wave span:nth-child(3) {
        height: 22px;
        animation-delay: 0.3s;
      }
      .wave span:nth-child(4) {
        height: 14px;
        animation-delay: 0.45s;
      }
      .wave span:nth-child(5) {
        height: 18px;
        animation-delay: 0.2s;
      }
      @keyframes wave {
        0%,
        100% {
          transform: scaleY(0.5);
          opacity: 0.6;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      /* --- upcoming grid --------------------------------------------- */
      .tabs {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 999px;
      }
      .tab {
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--text-dim);
        transition: all 160ms ease;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.active {
        background: var(--lime);
        color: #0a1005;
        font-weight: 600;
      }

      .events-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      .event-card {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform 280ms ease,
          border-color 280ms ease,
          box-shadow 280ms ease;
        cursor: pointer;
      }
      .event-card:hover {
        transform: translateY(-6px);
        border-color: oklch(0.9 0.22 128 / 0.45);
        box-shadow:
          0 20px 60px -20px oklch(0.9 0.22 128 / 0.25),
          0 0 0 1px oklch(0.9 0.22 128 / 0.1);
      }
      .event-visual {
        aspect-ratio: 16/9;
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid var(--line-soft);
      }
      .event-visual .stripes {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(var(--angle, 115deg), transparent 0 18px, oklch(1 0 0 / 0.035) 18px 20px);
      }
      .event-visual .ev-chip {
        position: absolute;
        top: 12px;
        left: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 5px 9px;
        border-radius: 6px;
        background: oklch(0 0 0 / 0.4);
        backdrop-filter: blur(8px);
        color: var(--text-dim);
        border: 1px solid oklch(1 0 0 / 0.1);
      }
      .event-visual .ev-label {
        position: absolute;
        bottom: 12px;
        left: 12px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px;
        color: oklch(1 0 0 / 0.3);
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .event-visual .orb-s {
        position: absolute;
        border-radius: 50%;
        filter: blur(34px);
        opacity: 0.55;
      }
      .event-body {
        padding: 22px 22px 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }
      .event-date {
        color: var(--lime);
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        letter-spacing: 0.1em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .event-date .sep {
        width: 14px;
        height: 1px;
        background: oklch(0.9 0.22 128 / 0.4);
      }
      .event-title {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
        margin: 2px 0 2px;
      }
      .event-desc {
        font-size: 13.5px;
        color: var(--text-dim);
        line-height: 1.55;
      }
      .event-foot {
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px dashed var(--line-soft);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12.5px;
        color: var(--text-mute);
      }
      .event-foot .venue {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .event-foot .seats {
        color: var(--text-dim);
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
      }
      .event-foot .seats b {
        color: var(--lime);
        font-weight: 500;
      }

      /* --- cta banner ------------------------------------------------ */
      .cta-wrap {
        position: relative;
        padding: 10px 0 120px;
      }
      .cta {
        position: relative;
        border-radius: 28px;
        padding: 72px 56px;
        overflow: hidden;
        text-align: center;
        background: linear-gradient(180deg, oklch(0.2 0.012 150), oklch(0.14 0.008 150));
      }
      .cta::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 28px;
        padding: 1.5px;
        background: linear-gradient(135deg, var(--lime) 0%, transparent 40%, transparent 60%, var(--amber) 100%);
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .cta::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 15% 20%, oklch(0.9 0.22 128 / 0.18), transparent 45%),
          radial-gradient(circle at 85% 80%, oklch(0.82 0.17 75 / 0.16), transparent 45%);
        pointer-events: none;
      }
      .cta h2 {
        font-size: clamp(32px, 4vw, 52px);
        letter-spacing: -0.035em;
        font-weight: 600;
        margin: 8px 0 16px;
        text-wrap: balance;
        line-height: 1.05;
      }
      .cta p {
        color: var(--text-dim);
        font-size: 16.5px;
        max-width: 54ch;
        margin: 0 auto 36px;
        text-wrap: pretty;
      }
      .cta-actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
        position: relative;
        z-index: 1;
      }
      .cta-actions .btn {
        padding: 16px 28px;
        font-size: 15px;
      }

      /* --- footer ---------------------------------------------------- */
      .footer {
        border-top: 1px solid var(--line-soft);
        padding: 48px 0 40px;
      }
      .footer-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
      }
      .footer-links {
        display: flex;
        gap: 26px;
        font-size: 13.5px;
        color: var(--text-dim);
      }

        place-items: center;
        padding: 24px;

      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);

        to {
          opacity: 1;
          transform: none;
        }

      .modal {
        width: 100%;

        padding: 32px;

        position: absolute;
        top: 18px;
        right: 18px;
        width: 32px;
        height: 32px;
        border-radius: 10px;

        transition: all 150ms;

        border-radius: 50%;

        color: var(--text-dim);
        font-size: 12.5px;

      .tweak-row select,
      .tweak-row input[type='range'] {
        background: var(--bg);
        border: 1px solid var(--line-soft);
        color: var(--text);
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 12px;

      /* --- responsive ------------------------------------------------ */
      @media (max-width: 900px) {
        .container {
          padding: 0 20px;

        // Edit mode wiring

          const onMsg = (e) => {
            const t = e.data?.type;
            if (t === '__activate_edit_mode') setEditMode(true);
            if (t === '__deactivate_edit_mode') setEditMode(false);
          };
          window.addEventListener('message', onMsg);
          window.parent.postMessage({ type: '__edit_mode_available' }, '*');
          return () => window.removeEventListener('message', onMsg);
        }, []);

        useEffect(() => {
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
        }, [tweaks]);

        // Apply accent-mix on root
        useEffect(() => {
          const r = document.documentElement;
          if (tweaks.accentMix === 'lime-only') {
            r.style.setProperty('--amber', 'oklch(0.88 0.22 128)');
            r.style.setProperty('--amber-dim', 'oklch(0.78 0.19 128)');
            r.style.setProperty('--amber-glow', 'oklch(0.88 0.22 128 / 0.35)');
          } else if (tweaks.accentMix === 'amber-only') {
            r.style.setProperty('--lime', 'oklch(0.82 0.17 75)');
            r.style.setProperty('--lime-dim', 'oklch(0.72 0.16 75)');
            r.style.setProperty('--lime-glow', 'oklch(0.82 0.17 75 / 0.35)');
          } else {
            r.style.setProperty('--lime', 'oklch(0.9 0.22 128)');
            r.style.setProperty('--lime-dim', 'oklch(0.78 0.19 128)');
            r.style.setProperty('--lime-glow', 'oklch(0.9 0.22 128 / 0.35)');
            r.style.setProperty('--amber', 'oklch(0.82 0.17 75)');
            r.style.setProperty('--amber-dim', 'oklch(0.72 0.16 75)');
            r.style.setProperty('--amber-glow', 'oklch(0.82 0.17 75 / 0.4)');
          }
        }, [tweaks.accentMix]);

        const onExplore = () => {
          const el = document.getElementById('events');
          if (el) {
            const y = el.getBoundingClientRect().top + window.pageYOffset - 68;
            window.scrollTo({ top: y, behavior: 'smooth' });
          }
        };

        return (
          <>
            <Nav onLogin={() => setModal('login')} />
            <Hero onExplore={onExplore} onJoin={() => setModal('register')} showMesh={tweaks.showBgMesh} />
            <LiveCard onOpen={() => setModal('login')} />
            <Upcoming onOpen={(ev) => setDetail(ev)} />
            <CtaBanner onCreate={() => setModal('register')} onLogin={() => setModal('login')} />
            <Footer />

            {modal && <AuthModal mode={modal} onClose={() => setModal(null)} onSwitch={setModal} />}
            {detail && (
              <EventDetail
                ev={detail}
                onClose={() => setDetail(null)}
                onRegister={() => {
                  setDetail(null);
                  setModal('register');
                }}
              />
            )}
            {editMode && <Tweaks tweaks={tweaks} setTweaks={setTweaks} onClose={() => setEditMode(false)} />}
          </>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <noscript>
      <div style="padding: 48px; font-family: system-ui; color: #fff">Enable JavaScript to view the Eventara landing page.</div>
    </noscript>
  </body>
</html>
