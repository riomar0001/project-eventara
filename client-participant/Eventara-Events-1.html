<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Events — Eventara</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <style>
      :root {
        --bg: oklch(0.17 0.008 150);
        --bg-2: oklch(0.21 0.01 150);
        --surface: oklch(0.23 0.012 150);
        --surface-2: oklch(0.27 0.014 150);
        --line: oklch(0.32 0.015 150);
        --line-soft: oklch(0.28 0.012 150 / 0.6);
        --text: oklch(0.98 0.005 150);
        --text-dim: oklch(0.78 0.01 150);
        --text-mute: oklch(0.58 0.012 150);
        --lime: oklch(0.9 0.22 128);
        --lime-dim: oklch(0.78 0.19 128);
        --lime-glow: oklch(0.9 0.22 128 / 0.35);
        --amber: oklch(0.82 0.17 75);
        --amber-dim: oklch(0.72 0.16 75);
        --amber-glow: oklch(0.82 0.17 75 / 0.4);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'ss01', 'cv11';
        overflow-x: hidden;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      input {
        font-family: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      .container {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 32px;
      }

      /* ---- ambient mesh ---- */
      .page-mesh {
        position: absolute;
        inset: 0 0 auto 0;
        height: 620px;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      .page-mesh::before,
      .page-mesh::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .page-mesh::before {
        width: 640px;
        height: 640px;
        left: -180px;
        top: -220px;
        background: radial-gradient(circle, oklch(0.9 0.22 128 / 0.45), transparent 65%);
      }
      .page-mesh::after {
        width: 540px;
        height: 540px;
        right: -140px;
        top: -120px;
        background: radial-gradient(circle, oklch(0.82 0.17 75 / 0.28), transparent 65%);
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 30%, transparent 75%);
        opacity: 0.35;
      }

      /* ---- nav ---- */
      .nav {
        position: sticky;
        top: 0;
        z-index: 40;
        backdrop-filter: blur(18px) saturate(140%);
        background: oklch(0.17 0.008 150 / 0.75);
        border-bottom: 1px solid var(--line-soft);
      }
      .nav-inner {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        height: 68px;
        gap: 24px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-size: 18px;
      }
      .logo-mark {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: linear-gradient(145deg, var(--lime), var(--lime-dim));
        color: #0a1005;
        box-shadow: 0 0 18px -4px var(--lime-glow);
      }
      .nav-center {
        display: flex;
        gap: 4px;
        justify-content: center;
      }
      .nav-link {
        position: relative;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 14.5px;
        color: var(--text-dim);
        transition: color 150ms;
      }
      .nav-link:hover {
        color: var(--text);
      }
      .nav-link.active {
        color: var(--lime);
      }
      .nav-link.active::after {
        content: '';
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: -1px;
        height: 2px;
        background: var(--lime);
        box-shadow: 0 0 14px var(--lime-glow);
        border-radius: 2px;
      }
      .nav-right {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
      }
      .avatar-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 14px 4px 4px;
        border: 1px solid var(--line-soft);
        border-radius: 999px;
        transition: all 180ms;
      }
      .avatar-btn:hover {
        border-color: var(--text-mute);
        background: oklch(1 0 0 / 0.03);
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--lime), var(--amber));
        display: grid;
        place-items: center;
        color: #0a1005;
        font-weight: 700;
        font-size: 12.5px;
      }
      .avatar-btn .name {
        font-size: 13.5px;
        color: var(--text);
        font-weight: 500;
      }
      .avatar-btn .tier {
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--lime);
        font-family: 'JetBrains Mono', monospace;
      }

      /* ---- buttons ---- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 13px 20px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition: all 180ms ease;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--lime);
        color: #0a1005;
        box-shadow: 0 8px 28px -10px var(--lime-glow);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 40px -10px var(--lime-glow);
      }
      .btn-ghost {
        color: var(--text-dim);
        border: 1px solid var(--line);
        background: oklch(1 0 0 / 0.02);
      }
      .btn-ghost:hover {
        color: var(--text);
        border-color: oklch(1 0 0 / 0.2);
      }
      .btn-outline {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
      }
      .btn-outline:hover {
        border-color: var(--lime);
        color: var(--lime);
        box-shadow: 0 0 24px -8px var(--lime-glow);
      }

      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-mute);
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .eyebrow .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 12px var(--lime-glow);
      }

      /* ---- page header ---- */
      .page-header {
        position: relative;
        padding: 64px 0 36px;
      }
      .page-header h1 {
        font-size: clamp(42px, 5.5vw, 72px);
        letter-spacing: -0.035em;
        font-weight: 700;
        line-height: 1;
        margin: 18px 0 14px;
      }
      .page-header .lead {
        color: var(--text-dim);
        font-size: 16px;
        max-width: 58ch;
        margin: 0 0 36px;
        line-height: 1.55;
      }
      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
        flex-wrap: wrap;
        gap: 20px;
      }
      .header-meta {
        text-align: right;
      }
      .header-meta .count {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--lime);
        font-family: 'JetBrains Mono', monospace;
      }
      .header-meta .count-lbl {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-mute);
        font-family: 'JetBrains Mono', monospace;
        margin-top: 2px;
      }

      /* ---- search ---- */
      .search-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
        margin-top: 8px;
      }
      .search {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 14px;
        transition: all 200ms ease;
      }
      .search:focus-within {
        border-color: var(--lime);
        box-shadow: 0 0 0 4px oklch(0.9 0.22 128 / 0.1);
        background: var(--surface-2);
      }
      .search .icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-mute);
      }
      .search input {
        width: 100%;
        background: transparent;
        border: none;
        padding: 18px 18px 18px 52px;
        color: var(--text);
        font-size: 15.5px;
        letter-spacing: -0.01em;
      }
      .search input::placeholder {
        color: var(--text-mute);
      }
      .search input:focus {
        outline: none;
      }
      .search .kbd {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--bg);
        border: 1px solid var(--line-soft);
        color: var(--text-mute);
      }
      .sort-select {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        color: var(--text);
        padding: 0 18px;
        height: 56px;
        border-radius: 14px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: border-color 160ms;
        min-width: 180px;
      }
      .sort-select:hover {
        border-color: var(--text-mute);
      }
      .sort-select .label {
        color: var(--text-mute);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .sort-select .val {
        font-weight: 500;
      }

      /* ---- filter pills ---- */
      .filters {
        margin-top: 22px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .pill {
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid var(--line);
        color: var(--text-dim);
        background: transparent;
        transition: all 180ms ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .pill:hover {
        color: var(--text);
        border-color: var(--text-mute);
      }
      .pill.active {
        background: var(--lime);
        color: #0a1005;
        border-color: var(--lime);
        box-shadow: 0 0 0 4px oklch(0.9 0.22 128 / 0.12);
        font-weight: 600;
      }
      .pill .count {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        padding: 2px 6px;
        border-radius: 4px;
        background: oklch(1 0 0 / 0.06);
        color: inherit;
      }
      .pill.active .count {
        background: oklch(0 0 0 / 0.15);
        color: #0a1005;
      }

      .filter-sep {
        width: 1px;
        height: 24px;
        background: var(--line-soft);
        margin: 0 4px;
      }

      /* ---- featured banner ---- */
      .featured {
        margin-top: 40px;
        position: relative;
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        border-radius: 24px;
        overflow: hidden;
        background: linear-gradient(180deg, oklch(0.23 0.012 150), oklch(0.18 0.01 150));
        border: 1px solid var(--line);
        min-height: 340px;
      }
      .featured::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 85% 20%, oklch(0.82 0.17 75 / 0.18), transparent 45%);
        pointer-events: none;
      }
      .featured-body {
        padding: 40px 44px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: relative;
      }
      .featured-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 6px 10px;
        background: oklch(0.82 0.17 75 / 0.12);
        border: 1px solid oklch(0.82 0.17 75 / 0.4);
        border-radius: 999px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--amber);
        width: fit-content;
      }
      .featured-tag .star {
        width: 4px;
        height: 4px;
        background: var(--amber);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--amber-glow);
      }
      .featured-body h2 {
        font-size: clamp(28px, 3.2vw, 40px);
        letter-spacing: -0.03em;
        font-weight: 600;
        line-height: 1.08;
        margin: 4px 0 2px;
        max-width: 18ch;
        text-wrap: balance;
      }
      .featured-body p.desc {
        font-size: 14.5px;
        color: var(--text-dim);
        line-height: 1.55;
        max-width: 48ch;
        margin: 0;
      }
      .featured-meta {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding: 18px 0;
        border-top: 1px solid var(--line-soft);
        border-bottom: 1px solid var(--line-soft);
        margin-top: 8px;
      }
      .featured-meta .k {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-mute);
      }
      .featured-meta .v {
        font-size: 14px;
        font-weight: 500;
        margin-top: 3px;
        color: var(--text);
      }
      .featured-actions {
        display: flex;
        gap: 10px;
        margin-top: auto;
      }
      .featured-visual {
        position: relative;
        overflow: hidden;
        border-left: 1px solid var(--line-soft);
        background:
          radial-gradient(circle at 30% 70%, oklch(0.9 0.22 128 / 0.28), transparent 55%),
          radial-gradient(circle at 80% 25%, oklch(0.82 0.17 75 / 0.35), transparent 55%), linear-gradient(135deg, oklch(0.2 0.01 150), oklch(0.14 0.008 150));
      }
      .featured-visual .stripes {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(105deg, transparent 0 24px, oklch(1 0 0 / 0.028) 24px 26px);
      }
      .featured-visual .orb-a {
        position: absolute;
        left: 20%;
        top: 30%;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        filter: blur(34px);
        background: var(--lime);
        opacity: 0.3;
      }
      .featured-visual .orb-b {
        position: absolute;
        right: 12%;
        bottom: 18%;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        filter: blur(30px);
        background: var(--amber);
        opacity: 0.45;
      }
      .featured-visual .label {
        position: absolute;
        bottom: 16px;
        left: 20px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: oklch(1 0 0 / 0.3);
      }
      .featured-visual .year {
        position: absolute;
        top: 32px;
        right: 40px;
        font-size: clamp(80px, 12vw, 160px);
        font-weight: 700;
        letter-spacing: -0.05em;
        color: transparent;
        -webkit-text-stroke: 1.5px oklch(1 0 0 / 0.12);
        line-height: 0.8;
      }

      /* ---- list controls ---- */
      .list-controls {
        margin-top: 56px;
        margin-bottom: 22px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
      }
      .list-controls h3 {
        font-size: 24px;
        letter-spacing: -0.02em;
        font-weight: 600;
        margin: 0;
      }
      .list-controls .results {
        color: var(--text-mute);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        margin-top: 4px;
      }
      .view-toggle {
        display: flex;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
      }
      .view-toggle button {
        padding: 7px 10px;
        border-radius: 7px;
        color: var(--text-mute);
        font-size: 12px;
        transition: all 140ms;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .view-toggle button.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 0 0 1px var(--line-soft);
      }

      /* ---- events grid ---- */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      .event-card {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform 280ms ease,
          border-color 280ms ease,
          box-shadow 280ms ease;
        position: relative;
      }
      .event-card:hover {
        transform: translateY(-6px);
        border-color: oklch(0.9 0.22 128 / 0.45);
        box-shadow: 0 20px 60px -20px oklch(0.9 0.22 128 / 0.22);
      }
      .event-card.urgent:hover {
        border-color: oklch(0.82 0.17 75 / 0.55);
        box-shadow: 0 20px 60px -20px oklch(0.82 0.17 75 / 0.28);
      }
      .event-visual {
        aspect-ratio: 16/9;
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid var(--line-soft);
      }
      .event-visual .stripes {
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(var(--angle, 115deg), transparent 0 20px, oklch(1 0 0 / 0.035) 20px 22px);
      }
      .event-visual .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(32px);
        opacity: 0.5;
      }
      .date-badge {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 2;
        background: oklch(0 0 0 / 0.55);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        padding: 8px 10px;
        text-align: center;
        min-width: 54px;
      }
      .date-badge .mo {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--lime);
        font-weight: 500;
      }
      .date-badge .day {
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.03em;
        line-height: 1;
        margin-top: 1px;
      }
      .status-pill {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px 5px 8px;
        border-radius: 999px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        backdrop-filter: blur(8px);
      }
      .status-pill.closing {
        background: oklch(0.82 0.17 75 / 0.15);
        border: 1px solid oklch(0.82 0.17 75 / 0.4);
        color: var(--amber);
      }
      .status-pill.live {
        background: oklch(0.82 0.17 75 / 0.15);
        border: 1px solid oklch(0.82 0.17 75 / 0.4);
        color: var(--amber);
      }
      .status-pill.new {
        background: oklch(0.9 0.22 128 / 0.12);
        border: 1px solid oklch(0.9 0.22 128 / 0.4);
        color: var(--lime);
      }
      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        position: relative;
      }
      .pulse-dot::after {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.5;
        animation: ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes ping {
        0% {
          transform: scale(0.6);
          opacity: 0.6;
        }
        80%,
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      .event-visual .ph-label {
        position: absolute;
        bottom: 12px;
        left: 14px;
        font-family: 'JetBrains Mono', monospace;

                e.title.toLowerCase().includes(needle) ||
                e.venue.toLowerCase().includes(needle) ||
                e.tags.some((t) => t.toLowerCase().includes(needle)) ||
                e.cat.toLowerCase().includes(needle)
            );
          }
          const monthIdx = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
          list.sort((a, b) => {
            if (sort === 'date') return new Date(a.year, monthIdx[a.mo], +a.day) - new Date(b.year, monthIdx[b.mo], +b.day);
            if (sort === 'popularity') return b.total - b.seats - (a.total - a.seats);
            if (sort === 'availability') return b.seats - a.seats;
            return 0;
          });
          return list;
        }, [q, cat, sort]);

        const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
        const currentPage = Math.min(page, totalPages);
        const paged = filtered.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

        const counts = useMemo(() => {
          const obj = { All: ALL_EVENTS.length };
          for (const c of CATEGORIES) if (c.key !== 'All') obj[c.key] = ALL_EVENTS.filter((e) => e.cat === c.key).length;
          return obj;
        }, []);

        const loadedPct = Math.round(((currentPage * PER_PAGE) / filtered.length) * 100);

        const changeCat = (c) => {
          setCat(c);
          setPage(1);
        };
        const changeQ = (v) => {
          setQ(v);
          setPage(1);
        };

        return (
          <>
            <Nav />
            <div style={{ position: 'relative' }}>
              <div className="page-mesh">
                <div className="grid-overlay" />
              </div>

              <div className="container" style={{ position: 'relative', zIndex: 1 }}>
                <header className="page-header">
                  <div className="header-top">
                    <div>
                      <span className="eyebrow">
                        <span className="dot" /> EVENT DIRECTORY · APR–JUL 2026
                      </span>
                      <h1>Discover Events</h1>
                      <p className="lead">Browse {ALL_EVENTS.length} upcoming workshops, meetups and hackathons across the Davao DeFi community.</p>
                    </div>
                    <div className="header-meta">
                      <div className="count">{String(ALL_EVENTS.length).padStart(2, '0')}</div>
                      <div className="count-lbl">Active listings</div>
                    </div>
                  </div>

                  <div className="search-row">
                    <div className="search">
                      <span className="icon">
                        <Icon name="search" size={18} />
                      </span>
                      <input placeholder="Search events, venues, tags…" value={q} onChange={(e) => changeQ(e.target.value)} />
                      <span className="kbd">⌘ K</span>
                    </div>
                    <button className="sort-select" onClick={() => setSortOpen((o) => !o)} style={{ position: 'relative' }}>
                      <span className="label">Sort</span>
                      <span className="val">{sort === 'date' ? 'By date' : sort === 'popularity' ? 'Popularity' : 'Availability'}</span>
                      <Icon name="chevron-down" size={14} />
                      {sortOpen && (
                        <div className="dropdown-menu" style={{ top: 'calc(100% + 6px)' }} onClick={(e) => e.stopPropagation()}>
                          {[
                            ['date', 'By date'],
                            ['popularity', 'Most popular'],
                            ['availability', 'Most available']
                          ].map(([k, lbl]) => (
                            <button
                              key={k}
                              className={`dropdown-item ${sort === k ? 'selected' : ''}`}
                              onClick={() => {
                                setSort(k);
                                setSortOpen(false);
                              }}
                            >
                              {lbl}
                            </button>
                          ))}
                        </div>
                      )}
                    </button>
                  </div>

                  <div className="filters">
                    {CATEGORIES.map((c) => (
                      <button key={c.key} className={`pill ${cat === c.key ? 'active' : ''}`} onClick={() => changeCat(c.key)}>
                        {c.label}
                        <span className="count">{counts[c.key]}</span>
                      </button>
                    ))}
                    <div className="filter-sep" />
                    <button className="pill">This month</button>
                    <button className="pill">Free</button>
                    <button className="pill">Members only</button>
                  </div>

                  {tweaks.bannerVariant === 'featured' && (
                    <Featured
                      onOpen={() =>
                        setDetail({
                          ...ALL_EVENTS[2],
                          title: FEATURED.title,
                          desc: FEATURED.desc,
                          date: FEATURED.date,
                          time: FEATURED.time,
                          venue: FEATURED.venue
                        })
                      }
                    />
                  )}
                </header>

                <section>
                  <div className="list-controls">
                    <div>
                      <h3>{cat === 'All' ? 'All events' : cat}</h3>
                      <div className="results">
                        {filtered.length} result{filtered.length !== 1 ? 's' : ''}
                        {q && (
                          <>
                            {' '}
                            · query <span style={{ color: 'var(--lime)' }}>"{q}"</span>
                          </>
                        )}
                      </div>
                    </div>
                    <div className="view-toggle">
                      <button className={view === 'grid' ? 'active' : ''} onClick={() => setView('grid')}>
                        <Icon name="grid" size={13} /> Grid
                      </button>
                      <button className={view === 'list' ? 'active' : ''} onClick={() => setView('list')}>
                        <Icon name="list" size={13} /> List
                      </button>
                    </div>
                  </div>

                  <div
                    className="grid"
                    style={{ gridTemplateColumns: view === 'list' ? '1fr' : tweaks.density === 'compact' ? 'repeat(4, 1fr)' : 'repeat(3, 1fr)' }}
                  >
                    {paged.length === 0 ? (
                      <div className="empty">
                        <div className="empty-icon">
                          <Icon name="search" size={22} />
                        </div>
                        <h4>No events match your filters</h4>
                        <p>Try a broader search or reset your category selection.</p>
                      </div>
                    ) : (
                      paged.map((ev) => <EventCard key={ev.id} ev={ev} onOpen={setDetail} />)
                    )}
                  </div>
                </section>

                {filtered.length > 0 && (
                  <div className="paginate-wrap">
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
                      <div className="load-progress">
                        <div className="load-progress-fill" style={{ width: `${Math.min(100, loadedPct)}%` }} />
                      </div>
                      <div className="load-progress-lbl">
                        Showing {(currentPage - 1) * PER_PAGE + 1}–{Math.min(currentPage * PER_PAGE, filtered.length)} of {filtered.length}
                      </div>
                    </div>

                    {currentPage < totalPages ? (
                      <button className="btn btn-outline" onClick={() => setPage((p) => p + 1)}>
                        Load more events <Icon name="arrow-right" size={14} />
                      </button>
                    ) : (
                      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: 'var(--text-mute)', letterSpacing: '0.14em' }}>
                        — END OF LIST —
                      </div>
                    )}

                    <div className="pagination">
                      <button className="page-btn" disabled={currentPage === 1} onClick={() => setPage((p) => Math.max(1, p - 1))}>
                        <Icon name="arrow-left" size={13} />
                      </button>
                      {Array.from({ length: totalPages }, (_, i) => i + 1).map((n) => (
                        <button key={n} className={`page-btn ${n === currentPage ? 'active' : ''}`} onClick={() => setPage(n)}>
                          {n}
                        </button>
                      ))}
                      <button className="page-btn" disabled={currentPage === totalPages} onClick={() => setPage((p) => Math.min(totalPages, p + 1))}>
                        <Icon name="arrow-right" size={13} />
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>

            <footer className="footer">
              <div className="footer-inner container">
                <div className="logo">
                  <div className="logo-mark">
                    <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
                      <path d="M2 10 L10 2 L18 10 L10 18 Z" stroke="#0a1005" strokeWidth="2" fill="none" />
                      <circle cx="10" cy="10" r="2.5" fill="#0a1005" />
                    </svg>
                  </div>
                  <span>Eventara</span>
                </div>
                <div className="footer-links">
                  <a href="#">Privacy Policy</a>
                  <a href="#">Terms of Service</a>
                  <a href="#">Contact</a>
                </div>
                <div className="socials">
                  <a className="social-btn" href="#">
                    <Icon name="twitter" size={15} />
                  </a>
                  <a className="social-btn" href="#">
                    <Icon name="discord" size={16} />
                  </a>
                  <a className="social-btn" href="#">
                    <Icon name="telegram" size={16} />
                  </a>
                </div>
              </div>
              <div className="container" style={{ marginTop: 28, display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
                <div className="copyright">© 2026 EVENTARA — Built for the Davao DeFi Community PH.</div>
                <div className="copyright" style={{ color: 'var(--text-dim)' }}>
                  <span style={{ color: 'var(--lime)' }}>●</span> All systems operational
                </div>
              </div>
            </footer>

            {detail && <EventDetail ev={detail} onClose={() => setDetail(null)} />}
            {editMode && <Tweaks tweaks={tweaks} setTweaks={setTweaks} onClose={() => setEditMode(false)} />}
          </>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <noscript><div style="padding: 48px; font-family: system-ui; color: #fff">Enable JavaScript to view the Eventara Events Directory.</div></noscript>
  </body>
</html>
